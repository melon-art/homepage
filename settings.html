<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · 个人学术主页</title>
  <script src="profile.js" defer></script>
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #242b34; --body-ink: #414a54; --muted: #626b75; --gold: #866b35; --gold-soft: #f8f5ed; --line: #e4e6e8; --font-body: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; --font-heading: Georgia, "Songti SC", SimSun, serif; --radius-control: 6px; --radius-input: 12px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    ::selection { background: #eae2d2; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .settings-page { width: min(1480px, calc(100% - 96px)); margin-inline: auto; }
    .settings-header { min-height: 92px; display: flex; align-items: center; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 7px 0; color: var(--body-ink); text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .settings-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 54px; padding: 34px 0 48px; align-items: start; }
    .settings-sidebar { padding-right: 28px; }
    .settings-nav { display: flex; flex-direction: column; }
    .settings-nav a { display: block; padding: 12px 18px; border-radius: var(--radius-control); color: var(--gold); background: var(--gold-soft); text-decoration: none; }
    .settings-main { min-width: 0; }
    h1 { margin: 0 0 13px; font: 700 2rem/1.3 var(--font-heading); text-wrap: balance; }
    .settings-note { margin: 0; color: var(--muted); font-size: .9375rem; }
    form { margin-top: 32px; }
    .fields { display: grid; gap: 27px; max-width: 820px; }
    label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--ink); }
    input { display: block; width: 100%; min-height: 52px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-input); background: var(--paper); color: var(--ink); caret-color: var(--gold); }
    input::placeholder { color: var(--muted); opacity: 1; }
    input:hover { border-color: var(--muted); }
    input:focus { border-color: var(--gold); outline: 2px solid var(--gold-soft); outline-offset: 2px; }
    .field-help { margin: 9px 0 0; color: var(--muted); font-size: .8125rem; }
    .form-actions { display: flex; align-items: center; justify-content: flex-end; gap: 18px; margin-top: 42px; padding-top: 22px; border-top: 1px solid var(--line); }
    .form-status { margin: 0 auto 0 0; min-width: 0; color: var(--gold); font-size: .9375rem; overflow-wrap: anywhere; }
    .save-button { flex: none; min-height: 44px; min-width: 112px; padding: 10px 25px; border: 0; border-radius: var(--radius-control); background: var(--gold-soft); color: var(--gold); cursor: pointer; font-weight: 600; }
    .save-button:hover { box-shadow: inset 0 0 0 1px var(--gold); }
    @media (max-width: 1100px) { .settings-page { width: calc(100% - 56px); } .settings-layout { grid-template-columns: 29% minmax(0, 1fr); gap: 36px; } }
    @media (max-width: 820px) { .settings-page { width: calc(100% - 40px); } .settings-layout { grid-template-columns: 160px minmax(0, 1fr); gap: 28px; } .settings-sidebar { padding: 0; } }
    @media (max-width: 620px) { .settings-page { width: calc(100% - 36px); } .settings-header { min-height: 80px; } .settings-layout { grid-template-columns: 1fr; gap: 30px; padding-top: 12px; } .settings-nav { flex-direction: row; } .settings-nav a { padding: 9px 18px; } h1 { font-size: 1.875rem; } form { margin-top: 27px; } .form-actions { margin-top: 32px; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="settings-page">
    <header class="settings-header">
      <a class="back-link" href="index.html" data-home-link><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>返回主页</a>
    </header>
    <main class="settings-layout">
      <aside class="settings-sidebar">
        <nav class="settings-nav" aria-label="设置导航"><a href="#basic-info" aria-current="page">基本信息</a></nav>
      </aside>
      <section class="settings-main" id="basic-info" aria-labelledby="settings-title">
        <h1 id="settings-title">基本信息</h1>
        <p class="settings-note" id="storage-note">保存后返回主页。修改保存在当前浏览器，仅用于本机预览。</p>
        <form id="profile-form" aria-describedby="storage-note">
          <div class="fields">
            <div class="field">
              <label for="profile-name">姓名</label>
              <input id="profile-name" name="name" type="text" placeholder="请输入姓名" maxlength="80" autocomplete="name" aria-describedby="name-help">
              <p class="field-help" id="name-help">同步更新主页姓名和自我介绍中的姓名；留空恢复占位文字。</p>
            </div>
            <div class="field">
              <label for="profile-degree">学历</label>
              <input id="profile-degree" name="degree" type="text" placeholder="例如：硕士研究生" maxlength="120" autocomplete="off" aria-describedby="degree-help">
              <p class="field-help" id="degree-help">填写学历或在读阶段；留空恢复占位文字。</p>
            </div>
          </div>
          <div class="form-actions">
            <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
            <button class="save-button" type="submit">保存</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
