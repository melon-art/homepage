<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增 News · 个人学术主页</title>
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #242b34; --body-ink: #414a54; --gold: #866b35; --font-body: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; --font-heading: Georgia, "Songti SC", SimSun, serif; }
    * { box-sizing: border-box; }
    html { scrollbar-color: #c5c7cc var(--paper); scrollbar-width: thin; scrollbar-gutter: stable; }
    @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
    ::selection { background: #eae2d2; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .news-editor-page { width: min(1480px, calc(100% - 96px)); margin-inline: auto; }
    .news-editor-header { min-height: 92px; display: flex; align-items: center; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 7px 0; color: var(--body-ink); text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .news-editor-main { padding: 34px 0 48px; }
    h1 { margin: 0; font: 700 2rem/1.3 var(--font-heading); text-wrap: balance; overflow-wrap: anywhere; }
    @media (max-width: 1100px) { .news-editor-page { width: calc(100% - 56px); } }
    @media (max-width: 820px) { .news-editor-page { width: calc(100% - 40px); } }
    @media (max-width: 620px) { .news-editor-page { width: calc(100% - 36px); } .news-editor-header { min-height: 80px; } .news-editor-main { padding-top: 12px; } h1 { font-size: 1.875rem; } }
  </style>
</head>
<body>
  <div class="news-editor-page">
    <header class="news-editor-header">
      <a class="back-link" href="index.html#news-title"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 5-7 7 7 7M3 12h18"/></svg>返回主页</a>
    </header>
    <main class="news-editor-main" aria-labelledby="news-edit-title">
      <h1 id="news-edit-title">新增 News</h1>
      <!-- 按当前需求保留空白，后续再加入 News 编辑内容。 -->
    </main>
  </div>
</body>
</html>
