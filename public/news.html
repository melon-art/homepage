<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News · 个人学术主页</title>
  <link rel="stylesheet" href="assets/css/news.css?v=016d5d863111">
  <script src="assets/js/file-store.js?v=260b73f1e3fa" defer></script>
  <script src="assets/js/news.js?v=file-1" defer></script>
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #242b34; --body-ink: #414a54; --gold: #866b35; --gold-soft: #f8f5ed; --card: #f8f9fa; --type-body: 1.125rem; --type-meta: .9375rem; --radius-card: 10px; --radius-control: 6px; --shadow-card: 0 1px 3px rgba(30,39,48,.08); --font-body:var(--font-site); --font-heading:var(--font-site); }
    * { box-sizing: border-box; }
    html { scrollbar-color: #c5c7cc var(--paper); scrollbar-width: thin; scrollbar-gutter: stable; }
    @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    [hidden] { display: none !important; }
    ::selection { background: #eae2d2; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .news-page { width: min(1480px, calc(100% - 96px)); margin-inline: auto; }
    .news-page-header { min-height: 92px; display: flex; align-items: center; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 7px 0; color: var(--body-ink); font-size: 1rem; text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    main { padding: 34px 0 48px; }
    .news { margin-top: 0; }
    h1 { margin: 0; font: 700 2rem/1.25 var(--font-heading); letter-spacing: -.015em; }
    @media (max-width: 1100px) { .news-page { width: calc(100% - 56px); } }
    @media (max-width: 820px) { .news-page { width: calc(100% - 40px); } }
    @media (max-width: 620px) { .news-page { width: calc(100% - 36px); } .news-page-header { min-height: 80px; } main { padding-top: 12px; } h1 { font-size: 1.875rem; } }
  </style>
  <link rel="stylesheet" href="assets/css/typography.css?v=423a50b84a1b">
</head>
<body>
  <div class="news-page">
    <header class="news-page-header">
      <a class="back-link" href="index.html#news-title"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 5-7 7 7 7M3 12h18"/></svg>返回主页</a>
    </header>
    <main>
      <section class="news" aria-labelledby="news-title">
        <div class="news-heading">
          <h1 id="news-title" lang="en">News</h1>
          <a class="news-add" href="news-edit.html?from=news" aria-label="新增 News" title="新增 News"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></a>
        </div>
        <ul class="news-list" data-news-scope="all">
          <li class="news-item"><div class="news-text"><span class="news-date">日期待补充</span><p class="news-copy">动态内容待补充</p></div></li>
        </ul>
        <p class="news-status" role="status" aria-live="polite" hidden></p>
      </section>
    </main>
  </div>
</body>
</html>
