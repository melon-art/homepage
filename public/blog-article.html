<section class="article-comments" id="article-comments" aria-labelledby="comment-title" hidden>

    <textarea id="comment-body" name="message" aria-label="写评论" placeholder="写评论…" rows="1" maxlength="1000" required></textarea>
    <div class="comment-actions">
      <button type="submit">提交评论</button>
      <span class="comment-note">评论和回复保存在当前浏览器。</span>
    </div>
    <span id="comment-feedback" role="status"></span>
  </form>

  <ol class="comment-list" id="comment-list" aria-label="评论列表" hidden></ol>
