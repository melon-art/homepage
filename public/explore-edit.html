<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>编辑卡牌 · 探索广场</title>
  <link rel="stylesheet" href="assets/css/explore-editor.css?v=1">
  <script src="assets/js/file-store.js?v=260b73f1e3fa" defer></script>
  <script src="assets/js/explore-editor.js?v=1" defer></script>
  <link rel="stylesheet" href="assets/css/typography.css?v=423a50b84a1b">
  <link rel="stylesheet" href="assets/css/blog-settings-nav.css?v=d6082bcf99df">
</head>
<body><div class="up-editor-page">
  <header class="up-editor-header"><a class="back-link" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>返回主页</a><a class="up-text-link" href="explore-manage.html">返回板块管理</a></header>
  <main class="ex-settings-layout">
    <aside><nav class="ex-settings-nav" aria-label="设置导航"><a href="settings.html">基本信息</a><a href="explore-manage.html" aria-current="page">探索广场</a><details class="blog-settings-menu"><summary>博客</summary><div><a href="blog-settings.html">个人信息</a><a href="blog-articles-settings.html">文章编辑</a></div></details></nav></aside>
    <section class="ex-main" aria-labelledby="ex-edit-title">
      <h1 id="ex-edit-title">编辑卡牌</h1>
      <p class="ex-note">修改卡牌内容，保存后返回管理列表。</p>
      <p class="up-status ex-message" id="ex-status" role="status" aria-live="polite">正在读取卡牌…</p>
      <form id="ex-form">
        <fieldset id="ex-fields" disabled>
          <div class="up-field"><label for="ex-name">标题</label><input id="ex-name" name="name" type="text" maxlength="24" required autocomplete="off" aria-describedby="ex-name-help"><p class="up-help" id="ex-name-help">最多24字。跳转页面保持原有目标。</p></div>
          <div class="up-field"><label for="ex-description">介绍</label><textarea id="ex-description" name="description" maxlength="160" required rows="4" aria-describedby="ex-description-help"></textarea><p class="up-help" id="ex-description-help">显示在卡牌与选中板块的说明中，最多160字。</p></div>
          <div class="up-field"><label for="ex-image">图片</label><div class="ex-image-layout"><div><input id="ex-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="ex-image-help ex-image-error"><p class="up-help" id="ex-image-help">JPG、PNG或WebP，不超过5 MB。建议使用横向页面截图。</p><p class="up-file-name" id="ex-image-name"></p><button class="up-link-button" id="ex-reset-image" type="button" hidden>使用默认图片</button><p class="up-error" id="ex-image-error" role="status" hidden></p></div><figure class="ex-image-preview"><img id="ex-image-preview" alt="卡牌图片预览" width="300" height="200"><figcaption>图片预览</figcaption></figure></div></div>
          <div class="up-actions"><a class="up-secondary" href="explore-manage.html">取消</a><button class="up-primary" type="submit">保存</button></div>
        </fieldset>
      </form>
    </section>
  </main>
</div></body></html>
