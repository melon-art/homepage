<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · 个人学术主页</title>
  <script src="assets/js/file-store.js?v=85fea61f45fd" defer></script>
  <script src="assets/js/about.js?v=4efae92768a9" defer></script>
  <script src="assets/js/profile.js?v=cafe688900f9" defer></script>
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #242b34; --body-ink: #414a54; --muted: #626b75; --gold: #866b35; --gold-soft: #f8f5ed; --line: #e4e6e8; --error: #a13c30; --font-body: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; --font-heading: Georgia, "Songti SC", SimSun, serif; --radius-control: 6px; --radius-input: 12px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; }
    html { scrollbar-color: #c5c7cc var(--paper); scrollbar-width: thin; scrollbar-gutter: stable; }
    @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
    [hidden] { display: none !important; }
    ::selection { background: #eae2d2; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .settings-page { width: min(1480px, calc(100% - 96px)); margin-inline: auto; }
    .settings-header { min-height: 92px; display: flex; align-items: center; }
    .back-link { display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 7px 0; color: var(--body-ink); text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    .back-link svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .settings-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 54px; padding: 34px 0 48px; align-items: start; }
    .settings-sidebar { padding-right: 28px; }
    .settings-nav { display: flex; flex-direction: column; }
    .settings-nav a { display: block; padding: 12px 18px; border-radius: var(--radius-control); color: var(--body-ink); text-decoration: none; }
    .settings-nav a:hover, .settings-nav a[aria-current="page"] { color: var(--gold); background: var(--gold-soft); }
    .settings-main { min-width: 0; }
    h1 { margin: 0 0 13px; font: 700 2rem/1.3 var(--font-heading); text-wrap: balance; }
    .settings-note { margin: 0; color: var(--muted); font-size: .9375rem; }
    form { margin-top: 32px; }
    .form-section { min-width: 0; margin: 0; padding: 0; border: 0; }
    .form-section + .form-section { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--line); }
    .form-section h2 { margin: 0 0 20px; font-size: 1.125rem; line-height: 1.5; font-weight: 600; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 820px; }
    .field { min-width: 0; }
    .field-wide { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--ink); }
    input, textarea { display: block; width: 100%; min-width: 0; min-height: 52px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-input); background: var(--paper); color: var(--ink); caret-color: var(--gold); }
    textarea { min-height: 240px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    input:hover, textarea:hover { border-color: var(--muted); }
    input:focus, textarea:focus { border-color: var(--gold); outline: 2px solid var(--gold-soft); outline-offset: 2px; }
    .about-field { max-width: none; }
    .about-editor-shell { border: 1px solid var(--line); border-radius: var(--radius-input); overflow: hidden; }
    .about-editor-shell:focus-within { border-color: var(--gold); }
    .about-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .format-button { min-height: 36px; padding: 5px 10px; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--body-ink); cursor: pointer; font-size: .875rem; }
    .format-button:hover, .format-button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold); }
    .format-button[data-about-bold] { font-weight: 700; }
    .format-button[data-about-gold] { color: var(--gold); }
    .color-control { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 2px 4px; color: var(--body-ink); font-size: .875rem; font-weight: 400; }
    .color-control input { width: 32px; min-height: 32px; height: 32px; padding: 3px; border-radius: var(--radius-control); cursor: pointer; }
    .about-editor { min-height: 280px; padding: 14px 16px; color: var(--body-ink); caret-color: var(--gold); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
    .about-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
    .about-editor:focus { outline: 2px solid var(--gold-soft); outline-offset: -2px; }
    .about-editor p, .about-editor div { margin: 0; }
    .editor-feedback { margin: 8px 0 0; color: var(--muted); font-size: .8125rem; }
    .editor-feedback.has-error { color: var(--error); }
    input[type="file"] { padding: 8px; font-size: .875rem; }
    input::file-selector-button { margin-right: 12px; padding: 7px 12px; border: 0; border-radius: var(--radius-control); background: var(--gold-soft); color: var(--gold); font: inherit; cursor: pointer; }
    .photo-editor { display: flex; align-items: flex-start; gap: 20px; }
    .photo-preview { flex: none; width: 96px; height: 96px; border-radius: var(--radius-input); object-fit: cover; }
    .asset-controls { flex: 1; min-width: 0; }
    .asset-state { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
    .asset-name { min-width: 0; margin: 0; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
    .remove-button { min-height: 36px; padding: 4px 0; border: 0; background: transparent; color: var(--gold); font-size: .875rem; cursor: pointer; text-decoration: underline; text-underline-offset: .2em; }
    .asset-error { margin: 8px 0 0; color: var(--error); font-size: .875rem; }
    .save-button:disabled { opacity: .6; cursor: wait; }
    .field-help { margin: 9px 0 0; color: var(--muted); font-size: .8125rem; }
    .form-actions { display: flex; align-items: center; justify-content: flex-end; gap: 18px; margin-top: 42px; padding-top: 22px; border-top: 1px solid var(--line); }
    .form-status { margin: 0 auto 0 0; min-width: 0; color: var(--gold); font-size: .9375rem; overflow-wrap: anywhere; }
    .save-button { flex: none; min-height: 44px; min-width: 112px; padding: 10px 25px; border: 0; border-radius: var(--radius-control); background: var(--gold-soft); color: var(--gold); cursor: pointer; font-weight: 600; }
    .save-button:hover { box-shadow: inset 0 0 0 1px var(--gold); }
    @media (max-width: 1100px) { .settings-page { width: calc(100% - 56px); } .settings-layout { grid-template-columns: 29% minmax(0, 1fr); gap: 36px; } }
    @media (max-width: 820px) { .settings-page { width: calc(100% - 40px); } .settings-layout { grid-template-columns: 160px minmax(0, 1fr); gap: 28px; } .settings-sidebar { padding: 0; } .fields { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { .settings-page { width: calc(100% - 36px); } .settings-header { min-height: 80px; } .settings-layout { grid-template-columns: 1fr; gap: 30px; padding-top: 12px; } .settings-nav { flex-direction: row; } .settings-nav a { padding: 9px 18px; } h1 { font-size: 1.875rem; } form { margin-top: 27px; } .form-actions { margin-top: 32px; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="settings-page">
    <header class="settings-header">
      <a class="back-link" href="index.html" data-home-link><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>返回主页</a>
    </header>
    <main class="settings-layout">
      <aside class="settings-sidebar">
        <nav class="settings-nav" aria-label="设置导航"><a href="#basic-info" aria-current="page">基本信息</a><a href="explore-manage.html">探索广场</a></nav>
      </aside>
      <section class="settings-main" id="basic-info" aria-labelledby="settings-title">
        <h1 id="settings-title">基本信息</h1>
        <p class="settings-note" id="storage-note">保存后写入本地项目文件并返回主页，不上传 GitHub；文字留空恢复占位。</p>
        <form id="profile-form" aria-describedby="storage-note">
          <section class="form-section" aria-labelledby="identity-title">
          <h2 id="identity-title">个人资料</h2>
          <div class="fields">
            <div class="field">
              <label for="profile-name">姓名</label>
              <input id="profile-name" name="name" type="text" placeholder="请输入姓名" maxlength="80" autocomplete="name" aria-describedby="name-help">
              <p class="field-help" id="name-help">更新主页左侧姓名；About 内容由你单独填写。</p>
            </div>
            <div class="field">
              <label for="profile-english-name">英文名</label>
              <input id="profile-english-name" name="englishName" type="text" placeholder="显示在页面左上角" maxlength="80" autocomplete="off">
            </div>
            <div class="field">
              <label for="profile-degree">学历</label>
              <input id="profile-degree" name="degree" type="text" placeholder="例如：硕士研究生" maxlength="120" autocomplete="off" aria-describedby="degree-help">
              <p class="field-help" id="degree-help">填写学历或在读阶段；留空恢复占位文字。</p>
            </div>
            <div class="field">
              <label for="profile-school">学校</label>
              <input id="profile-school" name="school" type="text" placeholder="请输入学校名称" maxlength="120" autocomplete="organization">
            </div>
            <div class="field">
              <label for="profile-department">院系</label>
              <input id="profile-department" name="department" type="text" placeholder="请输入院系名称" maxlength="120" autocomplete="off">
            </div>
            <div class="field">
              <label for="profile-major">专业</label>
              <input id="profile-major" name="major" type="text" placeholder="请输入专业名称" maxlength="120" autocomplete="off">
            </div>
            <div class="field field-wide">
              <label for="profile-photo">个人照片</label>
              <div class="photo-editor">
                <img class="photo-preview" data-photo-preview alt="已选择的个人照片预览" hidden>
                <div class="asset-controls">
                  <input id="profile-photo" name="photoFile" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-help photo-error">
                  <p class="field-help" id="photo-help">JPG、PNG 或 WebP，不超过 1 MB；主页按正方形居中裁切。</p>
                  <div class="asset-state"><p class="asset-name" data-asset-name="photo">尚未选择照片</p><button class="remove-button" data-remove-asset="photo" type="button" hidden>移除照片</button></div>
                  <p class="asset-error" id="photo-error" role="status"></p>
                </div>
              </div>
            </div>
          </div>
          </section>
          <section class="form-section" aria-labelledby="about-editor-title">
            <h2 id="about-editor-title">About</h2>
            <div class="fields about-field">
              <div class="field field-wide">
                <label id="introduction-label" for="profile-introduction">About 内容</label>
                <div class="about-editor-shell">
                  <div class="about-toolbar" role="group" aria-label="About 文字格式">
                    <button class="format-button" type="button" data-about-bold aria-pressed="false" title="加粗（Ctrl+B / ⌘B）">加粗</button>
                    <button class="format-button" type="button" data-about-gold>金色</button>
                    <label class="color-control" for="about-color">文字颜色<input id="about-color" type="color" value="#866b35" aria-label="文字颜色"></label>
                    <button class="format-button" type="button" data-about-clear>清除格式</button>
                  </div>
                  <div id="profile-introduction" class="about-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="introduction-label" aria-describedby="introduction-help about-feedback" data-placeholder="在这里填写主页 About 的全部内容"></div>
                </div>
                <input type="hidden" name="introduction">
                <p class="field-help" id="introduction-help">选中文字后加粗或更换颜色。支持 Ctrl+B / ⌘B、换行和空行，最多 10000 字符；保存后同步主页。</p>
                <p class="editor-feedback" id="about-feedback" role="status" aria-live="polite"></p>
              </div>
            </div>
          </section>
          <section class="form-section" aria-labelledby="contacts-title">
            <h2 id="contacts-title">联系方式</h2>
            <div class="fields">
              <div class="field"><label for="profile-phone">电话</label><input id="profile-phone" name="phone" type="tel" placeholder="电话号码" maxlength="80" autocomplete="tel"></div>
              <div class="field"><label for="profile-email">邮箱</label><input id="profile-email" name="email" type="email" placeholder="name@example.com" maxlength="254" autocomplete="email"></div>
              <div class="field"><label for="profile-wechat">微信</label><input id="profile-wechat" name="wechat" type="text" placeholder="微信号" maxlength="300" autocomplete="off"></div>
              <div class="field"><label for="profile-instagram">Instagram</label><input id="profile-instagram" name="instagram" type="text" placeholder="账号或完整主页链接" maxlength="500" autocomplete="off"></div>
              <div class="field"><label for="profile-xiaohongshu">小红书</label><input id="profile-xiaohongshu" name="xiaohongshu" type="text" placeholder="账号或完整主页链接" maxlength="500" autocomplete="off"></div>
              <div class="field"><label for="profile-bilibili">B 站</label><input id="profile-bilibili" name="bilibili" type="text" placeholder="账号或完整主页链接" maxlength="500" autocomplete="off"></div>
            </div>
            <p class="field-help">保存后，点击主页对应图标即可复制；留空时提示资料待提供。</p>
          </section>
          <section class="form-section" aria-labelledby="cv-title">
            <h2 id="cv-title">简历</h2>
            <div class="fields"><div class="field field-wide">
              <label for="profile-cv">简历文件</label>
              <input id="profile-cv" name="cvFile" type="file" accept="application/pdf,.pdf" aria-describedby="cv-help cv-error">
              <p class="field-help" id="cv-help">PDF，不超过 2 MB。保存后启用主页“下载简历”按钮。</p>
              <div class="asset-state"><p class="asset-name" data-asset-name="cv">尚未选择简历</p><button class="remove-button" data-remove-asset="cv" type="button" hidden>移除简历</button></div>
              <p class="asset-error" id="cv-error" role="status"></p>
            </div></div>
          </section>
          <div class="form-actions">
            <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
            <button class="save-button" type="submit">保存</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
