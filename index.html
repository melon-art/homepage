<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人学术主页视觉预览，个人资料待补充。">
  <title>个人学术主页 · 视觉预览</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #2c333b;
      --muted: #626b75;
      --gold: #846d3e;
      --gold-soft: #f8f5ee;
      --line: #e9eaec;
      --font-body: "Microsoft YaHei", "PingFang SC", sans-serif;
      --font-heading: Georgia, "Songti SC", SimSun, serif;
      --type-identity: 1.625rem;
      --type-section: 1.5rem;
      --type-body: 1rem;
      --type-label: 0.875rem;
      --type-meta: 0.8125rem;
      --type-hint: 0.75rem;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--type-body)/1.75 var(--font-body); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    ::selection { background: #eae2d2; color: var(--ink); }
    .page { --profile-width: 218px; --column-gap: 52px; width: min(1040px, calc(100% - 88px)); margin: 0 auto; }
    header { min-height: 80px; display: grid; grid-template-columns: var(--profile-width) minmax(0, 1fr); align-items: center; column-gap: var(--column-gap); }
    .wordmark { font: 700 var(--type-identity)/1.25 var(--font-heading); letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
    nav { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; column-gap: 28px; row-gap: 0; }
    .nav-item { padding: 8px 0; color: #51575e; font-size: var(--type-label); line-height: 1.5; white-space: nowrap; position: relative; cursor: default; outline-offset: 5px; }
    .nav-item::after { position: absolute; content: "待更新"; bottom: -21px; left: 50%; transform: translateX(-50%); padding: 4px 8px; background: var(--gold-soft); border-radius: 3px; font-size: var(--type-hint); line-height: 1.5; opacity: 0; pointer-events: none; }
    .nav-item:hover::after, .nav-item:focus-visible::after { opacity: 1; }
    main { display: grid; grid-template-columns: var(--profile-width) minmax(0, 1fr); column-gap: var(--column-gap); padding: 29px 0 36px; }
    .profile { min-width: 0; text-align: center; }
    .portrait { width: 196px; height: 224px; margin: 0 auto; border-radius: 2px; background: #f4f4f2; display: flex; align-items: center; justify-content: center; color: #66717c; }
    .portrait span { padding: 12px; font-size: var(--type-hint); line-height: 1.5; }
    h1 { margin: 15px 0 9px; font: 700 var(--type-identity)/1.4 var(--font-heading); letter-spacing: 0; text-wrap: balance; overflow-wrap: anywhere; }
    .degree { margin: 0 0 5px; color: var(--gold); font-size: var(--type-label); line-height: 1.65; text-wrap: balance; }
    .affiliation { margin: 0; color: var(--muted); font-size: var(--type-meta); line-height: 1.8; text-wrap: balance; overflow-wrap: anywhere; }
    .contacts { list-style: none; padding: 0; margin: 12px 0 0; display: flex; justify-content: center; align-items: center; gap: 3px; }
    .contact-button { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0; background: transparent; color: #5c6570; cursor: pointer; position: relative; }
    .contact-button:hover, .contact-button:focus-visible { color: var(--gold); }
    .contact-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .contact-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    .contact-button::after { content: attr(data-label); position: absolute; top: 35px; left: 50%; transform: translateX(-50%); background: var(--gold-soft); color: #675632; padding: 5px 8px; border-radius: 4px; font-size: var(--type-hint); line-height: 1.5; white-space: nowrap; pointer-events: none; opacity: 0; }
    .contact-button:hover::after, .contact-button:focus-visible::after { opacity: 1; }
    .introduction { min-width: 0; max-inline-size: 72ch; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    h2 { margin: 0 0 14px; font: 700 var(--type-section)/1.4 var(--font-heading); text-wrap: balance; overflow-wrap: anywhere; }
    .intro-copy { color: #404953; font-size: var(--type-body); line-height: 1.8; overflow-wrap: anywhere; }
    .intro-copy p { margin: 0 0 0.9em; text-wrap: pretty; }
    .intro-copy p:last-child { margin-bottom: 0; }
    .cv-area { margin: 16px 0 0; }
    .cv-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-bottom: 1px solid #c8b795; border-radius: 0; padding: 2px 0 3px; color: var(--gold); background: transparent; font-size: var(--type-label); line-height: 1.5; cursor: not-allowed; }
    .cv-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .news { margin-top: 28px; }
    .news-heading { margin-bottom: 5px; }
    .news-heading h2 { margin: 0; }
    .news-list { padding: 0; margin: 0; list-style: none; }
    .news-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px dotted #e2e3e4; font-size: var(--type-label); line-height: 1.8; }
    .news-date { color: var(--gold); font-size: var(--type-meta); line-height: inherit; font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }
    .news-copy { margin: 0; color: #555e68; text-wrap: pretty; overflow-wrap: anywhere; }
    .toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 10px); max-width: calc(100% - 32px); padding: 11px 19px; border-radius: 7px; background: #343c45; color: white; font-size: var(--type-meta); line-height: 1.65; overflow-wrap: anywhere; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1000px) { .page { --column-gap: 36px; width: calc(100% - 56px); } nav { column-gap: 23px; } }
    @media (max-width: 760px) { .page { width: calc(100% - 36px); } header { display: flex; flex-wrap: wrap; padding: 20px 0; gap: 14px; } nav { width: 100%; column-gap: 18px; justify-content: flex-start; } main { grid-template-columns: 1fr; gap: 36px; padding-top: 28px; } .profile { width: 260px; max-width: 100%; margin: auto; } }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="wordmark" aria-label="英文名待提供">Your Name</div>
      <nav aria-label="主导航">
        <span class="nav-item" role="link" aria-disabled="true" aria-label="研究方向，待更新" tabindex="0">研究方向</span>
        <span class="nav-item" role="link" aria-disabled="true" aria-label="课程作业，待更新" tabindex="0">课程作业</span>
        <span class="nav-item" role="link" aria-disabled="true" aria-label="爱好，待更新" tabindex="0">爱好</span>
        <span class="nav-item" role="link" aria-disabled="true" aria-label="活动，待更新" tabindex="0">活动</span>
        <span class="nav-item" role="link" aria-disabled="true" aria-label="获奖，待更新" tabindex="0">获奖</span>
      </nav>
    </header>
    <main>
      <aside class="profile" aria-label="个人信息">
        <div class="portrait" role="img" aria-label="个人照片待提供">
          <span>个人照片待提供</span>
        </div>
        <h1>你的姓名</h1>
        <p class="degree">目前学历 / 在读阶段</p>
        <p class="affiliation">学校名称 · 院系名称<br>专业名称</p>
        <div class="cv-area">
          <button class="cv-button" type="button" disabled aria-label="简历待上传，暂不可下载">下载简历<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg></button>
        </div>
        <ul class="contacts" aria-label="点击图标复制联系方式">
          <li><button class="contact-button" type="button" data-contact="phone" data-label="电话" aria-label="复制电话（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3 3.5 5.5c-1.5 5 6 12.5 11 11L17 14l-4-3-2 2c-2-1-3-2-4-4l2-2z"/></svg></button></li>
          <li><button class="contact-button" type="button" data-contact="email" data-label="邮箱" aria-label="复制邮箱（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="4" width="18" height="14" rx="2"/><path d="m3 6 8 6 8-6"/></svg></button></li>
          <li><button class="contact-button" type="button" data-contact="wechat" data-label="微信" aria-label="复制微信（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M12 13c-1 .5-2 .7-3 .7l-4 2 .8-3C3.9 11.7 3 10.1 3 8.5 3 5.5 6 3 9.5 3S16 5.5 16 8.5"/><path d="M20 14c0 2-2 4-4.5 4-.7 0-1.4-.1-2-.4L11 19l.5-2.3c-1-.7-1.5-1.7-1.5-2.7 0-2.3 2.2-4 5-4s5 1.7 5 4Z"/><path d="M7 7.5h.01M11 7.5h.01M13 13.5h.01M17 13.5h.01"/></svg></button></li>
          <li><button class="contact-button" type="button" data-contact="instagram" data-label="Instagram" aria-label="复制Instagram（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="5"/><circle cx="11" cy="11" r="4"/><circle cx="16" cy="6" r=".7" fill="currentColor"/></svg></button></li>
          <li><button class="contact-button" type="button" data-contact="xiaohongshu" data-label="小红书" aria-label="复制小红书（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 4c3-1 6-.3 8 1.5C13 3.7 16 3 19 4v14c-3-1-6-.3-8 1.5C9 17.7 6 17 3 18Z"/><path d="M11 5.5v14M6 8h2M6 11h2M14 8h2M14 11h2"/></svg></button></li>
          <li><button class="contact-button" type="button" data-contact="bilibili" data-label="B 站" aria-label="复制B 站（资料待提供）"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="6" width="18" height="13" rx="3"/><path d="m7 2 3 4m5-4-3 4M7 11v3m8-3v3m-6 2 2 1 2-1"/></svg></button></li>
        </ul>
      </aside>
      <div class="introduction">
        <section class="about-block" aria-labelledby="about-title">
        <h2 id="about-title" class="visually-hidden">关于我</h2>
        <div class="intro-copy">
          <p>你好，我是［姓名］，目前在［学校］［院系］攻读［学历］，专业为［专业名称］。</p>
          <p>我的研究兴趣包括［研究方向一］与［研究方向二］，近期关注［具体研究问题］。</p>
          <p>这里收录我的研究记录、课程作业，以及个人的兴趣与活动。</p>
        </div>

        </section>
        <section class="news" aria-labelledby="news-title">
          <div class="news-heading">
            <h2 id="news-title" lang="en">News</h2>
          </div>
          <ul class="news-list">
            <!-- 添加真实动态时，日期使用 time 元素和有效 datetime，按时间倒序排列。 -->
            <li class="news-item">
              <span class="news-date">日期待补充</span>
              <p class="news-copy">动态内容待补充。</p>
            </li>
          </ul>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    // 填入正式资料后，图标会复制对应号码、账号或完整主页链接。
    const CONTACTS = { phone: "", email: "", wechat: "", instagram: "", xiaohongshu: "", bilibili: "" };
    const toast = document.querySelector('.toast');
    let toastTimer;
    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('visible');
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
    }
    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(value); return; } catch (_) { /* 尝试本地页面兼容方式。 */ }
      }
      const field = document.createElement('textarea');
      field.value = value;
      field.style.cssText = 'position:fixed;left:-9999px;top:0';
      field.setAttribute('aria-hidden', 'true');
      const active = document.activeElement;
      document.body.appendChild(field);
      field.select();
      try {
        if (!document.execCommand('copy')) throw new Error('Copy unavailable');
      } finally { field.remove(); if (active) active.focus(); }
    }
    document.querySelectorAll('.contact-button').forEach(button => {
      const label = button.dataset.label;
      if (CONTACTS[button.dataset.contact]) button.setAttribute('aria-label', '复制' + label);
      button.addEventListener('click', async () => {
        const value = CONTACTS[button.dataset.contact];
        if (!value) { notify(label + '待提供'); return; }
        try { await copyText(value); notify(label + '已复制'); }
        catch (_) { notify('无法自动复制，请手动复制：' + value); }
      });
    });
  </script>
</body>
</html>
